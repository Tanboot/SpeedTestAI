services:
  # ----------------------------------------------------
  # 1. DATABASE (สำหรับใช้งานบน Local)
  # ----------------------------------------------------
  postgres-db:
    image: postgres:15-alpine
    container_name: k6-postgres
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=speedtest_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # ----------------------------------------------------
  # 2. BACKEND
  # ----------------------------------------------------
  fastapi-backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: k6-backend
    environment:
      - TZ=Asia/Bangkok
      - GCS_BUCKET_NAME=speedtest-artifacts-bucket
      - STORAGE_TYPE=local
      - LOCAL_STORAGE_DIR=/app
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - scripts_data:/app/scripts
      - summaries_data:/app/summaries
      - reviews_data:/app/reviews
    depends_on:
      - postgres-db

  # ----------------------------------------------------
  # 3. FRONTEND
  # ----------------------------------------------------
  streamlit-frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: k6-frontend
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=https://speedtest-backend-349863046910.asia-southeast1.run.app
    depends_on:
      - fastapi-backend

volumes:
  scripts_data:
  summaries_data:
  reviews_data:
  postgres_data: